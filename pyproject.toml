[project]
name = "aicommit"
version = "0.1.0"
description = "Draft Conventional Commit messages from your staged git diff using the Claude API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ali Raza", email = "thealirazadev@gmail.com" },
]
keywords = ["git", "commit", "cli", "anthropic", "claude", "conventional-commits"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "anthropic==0.116.0",
    "click==8.4.2",
    "rich==15.0.0",
    "tomli==2.5.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.21",
    "black==26.10.1",
]

[project.urls]
Homepage = "https://github.com/thealirazadev/aicommit"
Repository = "https://github.com/thealirazadev/aicommit"

[project.scripts]
aicommit = "aicommit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aicommit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=aicommit --cov-report=term-missing:skip-covered"

[tool.coverage.report]
fail_under = 90

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
target-version = ["py310"]
line-length = 88
